name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Bagimliliklar
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Testler
        run: npm test

  java-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: java-support testleri
        run: mvn -B -ntp -f java-support/pom.xml test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Basit secret scan
        shell: bash
        run: |
          PATTERNS='(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{36,})'
          if git grep -nE "$PATTERNS" -- . ':!package-lock.json'; then
            echo "SECRET BULUNDU"; exit 1
          fi
          echo "Secret scan temiz"
